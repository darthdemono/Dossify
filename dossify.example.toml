# Copy this to a private workspace.  Nothing here is read from the repository: every path is yours.
# A source runs only if it has a [providers.<name>] block.  Options per source: docs/PROVIDERS.md.

output_dir = "Journal"                 # month files are written here
people_file = "People.json"            # optional: who is who across services
# timezone = "Europe/London"           # IANA name; the default is this machine's own

[output]
profile = "journal"                    # digest | journal | chronicle

[privacy]
preset = "balanced"                    # minimal | balanced | forensic; delete the block for no restriction

# ---- general sources -------------------------------------------------------
[providers.git]
roots = ["~/Code"]                     # folders whose children are repositories

[providers.bank_statements]
sources = ["~/Documents/statements"]   # folders or files of CSV and PDF statements

# ---- social media: Dossify reads the data download each platform gives you ---
# Request your data from the platform, unzip it, and point `export` at the folder.
[providers.instagram]
export = "~/Exports/instagram"
messages = "none"                      # "none" counts messages only; "threads" also names the chat

[providers.facebook]
export = "~/Exports/facebook"

[providers.discord]
export = "~/Exports/discord"

[providers.snapchat]
export = "~/Exports/snapchat"

[providers.takeout]                    # Google
export = ["~/Exports/google-takeout"]  # the folder holding each account's extracted Takeout
search_text = false                    # true writes what you searched for; false counts only
browser_urls = false

# ---- optional, bundled niche sources: uncomment what matches your setup --------
# [providers.lastfm]
# user = "your-name"
# api_key_env = "LASTFM_API_KEY"
#
# [providers.jellyfin]
# user = "your-name"
# db = "~/jellyfin/data/jellyfin.db"

# ---- your own plugins: files in custom/ are found automatically; a block turns one on ----
# [providers.my_plugin]
# source = "~/Exports/something.csv"

# ---- typed export adapters (read a file you give them) ----------------------
# [providers.health_archive]
# source = "~/Exports/health/export.xml"
# [providers.activitywatch]
# source = "~/Exports/activitywatch.json"
# [providers.nextcloud]
# source = "~/Exports/nextcloud-activity.json"
# [providers.immich]
# source = "~/Exports/immich-metadata.json"
# [providers.google_takeout]
# source = "~/Exports/Takeout"

# ---- read-only network (off unless allow_network = true and the host is listed) ----
# [providers.http_json]
# allow_network = true
# url = "https://service.example/api/records"
# token_env = "SERVICE_TOKEN"
# items_path = "data.items"

# [oauth.<name>] and [sync] are documented in the README.
