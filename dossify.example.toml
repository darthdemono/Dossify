# Copy this to a private workspace. Do not put real paths, exports, or secrets
# in this repository.
people_file = "People.json"
output_dir = "Journal"

[journal]
# Private data which Dossify reads but never creates or commits.
workspace_root = "/absolute/path/to/private-workspace"
rules_file = "Journal Rules.json"
cache_dir = "/absolute/path/to/cache/dossify"
# Optional source checkout used by the Canvas adapter.
elteportal_path = "/absolute/path/to/EltePortal"

# Optional live People registry synchronization. Values here are service
# locations and environment-variable names only, never real credentials.
[sync]
nextcloud_url = "https://nextcloud.example/remote.php/dav/addressbooks/users/user/contacts"
nextcloud_user = "user"
nextcloud_password_env = "DOSSIFY_NEXTCLOUD_APP_PASSWORD"
immich_url = "https://immich.example"
immich_api_key_env = "DOSSIFY_IMMICH_API_KEY"
snapshot_dir = "sync-snapshots"

[providers.instagram]
enabled = true

[providers.git]
enabled = true

# Export-first v1 adapters. Each reads only the supplied file or directory;
# `dossify plan` previews every intended read before `dossify facts` parses it.
[providers.activitywatch]
enabled = false
source = "/absolute/path/to/activitywatch-export.json"

[providers.nextcloud]
enabled = false
source = "/absolute/path/to/nextcloud-activity.json"

[providers.immich]
enabled = false
source = "/absolute/path/to/immich-metadata.json"

[providers.google_takeout]
enabled = false
source = "/absolute/path/to/Takeout"

[providers.health_archive]
enabled = false
source = "/absolute/path/to/apple-health-export.xml"

# Output shape and privacy. Omit [privacy] for no restriction.
[output]
profile = "journal"   # digest | journal | chronicle for month files

[privacy]
preset = "balanced"   # minimal | balanced | forensic

[providers.hyperos_dashboard]
enabled = false
source = "/absolute/path/to/exports"   # folder holding dashboard-history.csv, or the file itself
phone_model = "optional"
hyperos_version = "optional"

# Third-party adapters you have read and chosen to trust, by entry-point name.
# [adapters]
# external = ["my_provider"]

