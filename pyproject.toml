[project]
name = "dossify"
version = "1.1.0"
description = "Local-first journal compiler with pluggable personal-data adapters."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jubair Hasan (DarthDemono)" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "dossify-adapter-api",
]

[tool.uv.sources]
dossify-adapter-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[project.scripts]
dossify = "dossify.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
